<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #fff8f0;
    color: #2c1a12;
    font-family: Arial, sans-serif;
}
a { color: inherit; }
.container {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
}
.header, .promo-banner, .panel, .product-card {
    background: #fff;
    border: 1px solid #ffe1b9;
    border-radius: 8px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .05);
}
.header {
    align-items: center;
    display: flex;
    gap: 24px;
    justify-content: space-between;
    margin: 24px 0;
    padding: 18px 24px;
}
.logo {
    align-items: center;
    color: #c23b22;
    display: flex;
    font-size: 24px;
    font-weight: 800;
    gap: 12px;
}
.logo-img {
    height: 48px;
    object-fit: contain;
    width: 48px;
}
.nav-menu {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-end;
}
.nav-menu a, .order-btn, .primary-btn {
    background: #e67e22;
    border: 0;
    border-radius: 40px;
    color: #fff;
    display: inline-block;
    font: inherit;
    font-weight: 700;
    padding: 11px 16px;
    text-align: center;
    text-decoration: none;
}
.nav-menu a:not(.cart-btn) {
    background: #fbe6ce;
    color: #7b3f1d;
}
.promo-banner {
    margin-bottom: 32px;
    padding: 32px 24px;
    text-align: center;
}
.promo-title {
    color: #c23b22;
    font-size: 30px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 10px;
}
.promo-desc, .card-desc, .cart-item-type, .cart-item-price {
    color: #6b4c3a;
}
.section-title, .page-title {
    color: #2c1a12;
    font-size: 28px;
    font-weight: 800;
    margin: 36px 0 18px;
}
.section-title {
    border-left: 6px solid #e67e22;
    padding-left: 14px;
}
.cards-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
}
.product-card {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    overflow: hidden;
}
.card-img {
    align-items: center;
    background: #fff4e6;
    display: flex;
    height: 190px;
    justify-content: center;
}
.card-img img {
    height: 100%;
    object-fit: cover;
    width: 100%;
}
.card-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 12px;
    padding: 18px;
}
.card-title, .cart-item-name {
    font-size: 20px;
    font-weight: 800;
}
.price, .cart-total-sum, .cart-item-total {
    color: #c23b22;
    font-size: 20px;
    font-weight: 800;
}
.page { padding: 32px 0; }
.panel {
    margin-bottom: 24px;
    padding: 24px;
}
.cart-item {
    align-items: center;
    border-bottom: 1px solid #ffe1b9;
    display: grid;
    gap: 16px;
    grid-template-columns: 1fr auto auto;
    padding: 16px 0;
}
.cart-item:last-child { border-bottom: 0; }
.cart-item-controls {
    align-items: center;
    display: flex;
    gap: 10px;
}
.cart-qty-btn {
    align-items: center;
    background: #fbe6ce;
    border-radius: 50%;
    color: #b45f2b;
    display: inline-flex;
    font-size: 18px;
    font-weight: 700;
    height: 32px;
    justify-content: center;
    text-decoration: none;
    width: 32px;
}
.cart-total-row, .summary-row, .summary-total {
    align-items: center;
    display: flex;
    justify-content: space-between;
}
.order-form {
    display: grid;
    gap: 18px;
}
.form-field {
    display: grid;
    font-weight: 700;
    gap: 8px;
}
.form-control {
    border: 1px solid #e4c8a8;
    border-radius: 8px;
    font: inherit;
    padding: 12px 14px;
    width: 100%;
}
.secondary-link, .cart-remove-btn {
    color: #b45f2b;
    font-weight: 700;
    text-decoration: none;
}
footer {
    color: #6b4c3a;
    margin-top: 48px;
    padding: 28px 0 36px;
}
@media (max-width: 760px) {
    .header, .cart-item { display: block; }
    .nav-menu { justify-content: flex-start; margin-top: 16px; }
}
</style>
